name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle" | head -n 1))
          echo "Target dir: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Setup wrapper if missing
          if [ ! -f "gradlew" ]; then
            curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle.zip
            ./gradle-8.2/bin/gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MazharsWorld-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
